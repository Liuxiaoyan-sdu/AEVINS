%YAML:1.0

# Camera-only configuration derived from sea2.yaml
# This configuration disables event processing and uses only the regular camera input.

#common parameters
imu_topic: "/camera/imu"
dvl_topic: "/dvl/velocity_converted"
dvl_position_topic: "/dvl/odometry"
dvl_add: 1
dvl_pose_add : 0



image_topic: "/camera/infra1/image_rect_raw"
model_type: PINHOLE
camera_name: camera1
image_width: 640
image_height: 480
distortion_parameters:
   k1: 0.2154
   k2: 0.3974
   p1: 0.0
   p2: 0.0
projection_parameters:
   fx: 518.7188
   fy: 518.7761
   cx: 319.6680
   cy: 234.1121


# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.
                        # 2  Don't know anything about extrinsic parameters. You don't need to give R,T. We will try to calibrate it. Do some rotation movement at beginning.                        
#If you choose 0 or 1, you should write down the following matrix.
#Rotation from camera frame to imu frame, imu^R_cam

# Extrinsic parameter between IMU and Camera.
# Rotation from camera frame to imu frame, imu^R_cam (cam -> imu)
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0.99978441,  0.00855114,  0.01892102,
           -0.00837646, 0.99992175, -0.00929184,
           -0.01899899, 0.00913134, 0.9997778 ]

# Translation from camera frame to imu frame, imu^T_cam (cam -> imu)
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.00168429, 0.00519201, 0.00750534]

dvlpose_information_matrix: !!opencv-matrix
   rows: 6
   cols: 1
   dt: d
   data: [1000, 1000, 1000, 1000, 1000, 1000]

tdvltoimu: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.0, 0.0, 0.0]

rdvltoimu: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0.0, 1.0, 0.0,
          -0.70710678118, 0.0, 0.70710678118, 
          0.70710678118, 0.0, 0.70710678118]
# DVL 信息矩阵 (3x3-)
dvl_information_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [9000.0, 0.0, 0.0,
          0.0, 9000.0, 0.0, 
          0.0, 0.0, 9000.0]

#feature traker paprameters
max_cnt: 300            # max feature number in feature tracking
min_dist: 10            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 1.5
F_threshold: 4.0  #mageransac threshold (pixel)   第1、0.5  1.5
F_threshold_1: 0.8     #event                                     0.7
show_track: 1           # publish tracking image as topic
equalize: 1             # if image is too dark or light, trun on equalize to find enough features
fisheye: 0              # if using fisheye, trun on it. A circle mask will be loaded to remove edge noisy points
image_enhance_gamma: 0.9 # Gamma correction for image brightness. 1.0: no change. < 1.0: brighten dark areas (e.g. 0.5). > 1.0: darken.

# 视觉约束鲁棒核函数参数（水下虚无区域外点剔除）
visual_loss_threshold: 4.0  # 视觉重投影误差阈值（像素），超过此值降低权重或设为0
                            # 水下环境建议: 3.0-8.0，虚无严重时用更大值（5.0-8.0）
use_hard_threshold: 1     # 0: Cauchy软核函数（默认，平滑降权）
                            # 1: 硬阈值（超过阈值权重=0，激进剔除）
                            # 2: 饱和损失（平滑过渡，介于两者之间）


#event feature parameters
use_event_compensation: 0  # 0: use uncompensated event frame (direct accumulation), 1: use motion-compensated event frame (better_flow)
use_dynamic_window: 0      # 0: use fixed event count, 1: use adaptive dynamic window for event collection
use_image_features: 1      # 0: disable image features, 1: enable image features (from normal camera)
use_event_features: 0      # 0: disable event features, 1: enable event features (from event camera)

# Dynamic window parameters (for event collection)
min_event_count: 2000      # Minimum event count threshold: collect events only if count >= this value
max_event_count: 30000     # Maximum event count (upper limit for collection)
initial_event_count: 10000  # Initial event count for first frame
alpha: 0.01                 # Adaptive coefficient α for dynamic window
min_pixel_ratio: 0.2       # Minimum pixel ratio (20%)
event_history_size: 1000000 # Event history buffer size
interval_time_ns: 80000000 # Time interval in nanoseconds (80ms)

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.08          # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.004         # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.00004         # accelerometer bias random work noise standard deviation.  #0.02
gyr_w: 2.0e-6       # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.81007     # gravity magnitude

#loop closure parameters
loop_closure: 1                    # start loop closure
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
fast_relocalization: 0             # useful in real-time and large project
pose_graph_save_path: "./output/pose_graph/" # save and load path

#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)
td_dvl: 0.0                         # time offset between DVL and image. unit: s. DVL clock + td_dvl = image clock

#rolling shutter parameters
rolling_shutter: 0                  # 0: global shutter camera, 1: rolling shutter camera
rolling_shutter_tr: 0               # unit: s. rolling shutter read out time per frame (from data sheet). 

#visualization parameters
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
save_loop_match_images: 1       # save geometrically verified loop feature correspondences under pose_graph_save_path/loop_matches
visualize_imu_forward: 0        # output imu forward propogation to achieve low latency and high frequence results
visualize_camera_size: 0.4      # size of camera marker in RVIZ
